# CLIProxyAPI 配置模板
# 用法:cp config.example.yaml config.yaml,改下面标了 CHANGE-ME 的两处。
# 注意:本文件被 docker-compose 直接挂载,CLIProxyAPI 不读 .env,
#       所以这里的密钥要手填(与 .env 里保持一致即可)。

host: "0.0.0.0"                 # 监听所有网卡(容器/多端访问必需)
port: 8317

remote-management:
  allow-remote: false           # 只锁管理后台 /v0/management;/v1 始终凭 key 可用
  secret-key: "CHANGE-ME-mgmt"  # = .env 的 CLIPROXY_MGMT_SECRET

auth-dir: "/root/.cli-proxy-api"   # OAuth 登录态目录(容器内)→ 宿主 data/cliproxyapi/auths

api-keys:
  - "CHANGE-ME-api-key"         # = .env 的 CLIPROXY_API_KEY,客户端放 Authorization: Bearer

proxy-url: "http://mihomo:7890"    # 出站去国外上游,走内置 mihomo
request-retry: 3
